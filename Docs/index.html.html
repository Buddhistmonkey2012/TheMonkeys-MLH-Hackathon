async function api(route, body, parameters = {}) {
  if (demoApi) return demoApi(state.as,route,body,parameters);
  const query = new URLSearchParams({mode:state.mode,as:state.as,...parameters});
  const response = await fetch('/api/' + route + '?' + query, body === undefined ? {} : {
    method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),
  });
  const data = await response.json();
  if (!response.ok) {
    const error = new Error(data.error || 'Something went wrong.');
    error.status = response.status;
    throw error;
  }
  return data;
}

async function authPost(action, body = {}) {
  const response = await fetch('/auth/' + action,{
    method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),
  });
  const result = await response.json();
  if (!response.ok) throw new Error(result.error || 'The account request could not be completed.');
  return result;
}
async function getAuthStatus() {
  const response = await fetch('/auth/status');
  if (!response.ok) return null;
  const data = await response.json();
  return data.accounts ? data : null;
}

let toastTimer;
function toast(message) {
  toastNode.textContent = message;
  toastNode.classList.add('shown');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastNode.classList.remove('shown'),4000);
}
let refreshCount = 0;
async function refresh({full = false} = {}) {
  const count = ++refreshCount;
  const next = await api('state');
  if (count !== refreshCount) return;
  const changed = JSON.stringify(state.data) !== JSON.stringify(next);
  state.data = next;
  if (!state.data.threads.some(t => t.id === state.active)) state.active = state.data.threads[0]?.id || null;
  if (full) render();
  else if (changed && state.page === 'messages') updateInbox();
  else if (changed && !modal.open) render();
  updateBadges();
}
async function loadMessages({mark = true, forceBottom = false} = {}) {
  const id = state.active;
  const viewIdentifier = state.mode + state.as;
  if (!id || state.page !== 'messages') return;
  const data = await api('thread',undefined,{id});
  if (state.active !== id || state.mode + state.as !== viewIdentifier) return;
  const changed = JSON.stringify(state.messages) !== JSON.stringify(data.messages);
  state.loadingThread = false;
  state.messages = data.messages;
  if (changed || forceBottom) updateMessages(forceBottom);
  const latest = data.messages.at(-1);
  if (mark && latest && activeThread()?.unread) {
    await api('read',{thread:id, through:latest.created_at});
    if (state.active === id && activeThread()) {
      activeThread().unread = 0;
      updateInbox();
      updateBadges();
    }
  }
}
function updateBadges() {
  const bell = document.querySelector('#bell');
  if (bell) {
    const count = dueReminders().length;
    bell.querySelector('.notification-dot').hidden = !count;
    bell.setAttribute('aria-label', count ? 'Reminders, ' + count + ' unread' : 'Reminders');
  }
  const badge = document.querySelector('#nav-unread');
  if (badge) {
    badge.textContent = state.data.threads.filter(t => t.unread).length;
    badge.hidden = badge.textContent === '0';
  }
}

const googleStamp = value => new Date(value).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z');
function googleUrl(e) {

const calText = value => String(value).replace(/\\/g,'\\\\').replace(/\r\n|\r|\n/g,'\\n').replace(/([,;])/g,'\\$1');
function foldCalendarLine(line) {
  const encoder = new TextEncoder();
  const chunks = [];
  let current = '', size = 0;
  for (const character of line) {
    const bytes = encoder.encode(character).length;
    if (size + bytes > 75) {
      chunks.push(current);
      current = ' ';
      size = 1;
    }
    current += character;
    size += bytes;
  }
  chunks.push(current);
  return chunks.join('\r\n');
}

    const result = await api('assistant',{thread:thread.id,task});
    if (!modal.open || modal.querySelector('.dialog-form') !== marker) return;
    openModal(label, `<div class="dialog-form"><p class="hint">${result.source === 'ai' ? 'AI suggestion · Review before sharing' : 'Built-in template preview'}</p><div id="assistant-result" class="assistant-result">${esc(result.text)}</div><div class="form-actions">
      <button type="button" class="button outline" data-action="copy-assistant">${icon('copy',16)} Copy</button>
      ${task === 'reply' ? '<button type="button" class="button primary" data-action="use-draft">Use as draft</button>' : ''}
      </div></div>`);
  } catch (error) {
    if (modal.open && modal.querySelector('.dialog-form') === marker) openModal(label, '<div class="dialog-form"><p role="status">' + esc(error.message) + '</p></div>');
  }
}

async function selectThread(id) {
  state.active = id;
  state.page = 'messages';
  state.mobileThread = true;
  state.messages = [];
  state.loadingThread = true;
  render();
  await loadMessages({forceBottom:true});
}
async function changeWorkspace(mode, person = 'avery') {
  state.mode = mode;
  state.as = person;
  storage.set('tw.mode',mode);
  storage.set('tw.as',person);
  Object.assign(state,{page:'messages',active:null,messages:[],filter:'',messageFilter:'all',menu:false,mobileThread:false,drafts:new Map()});
  if (modal.open) modal.close();
  await refresh({full:true});
  await loadMessages({forceBottom:true});
}
function dayEvents(day) {
  const events = state.data.events.filter(e => dateOnly(new Date(e.starts_at)) === day &&
    (state.calendar === 'all' || (state.calendar === 'public' ? e.visibility === 'Public' : isAttending(e))));
  openModal(dayText(new Date(day + 'T12:00')),`<div class="dialog-form">
    ${events.length ? events.map(upcomingItem).join('') : '<p>No events on this day.</p>'}
    <div class="form-actions"><button type="button" class="button primary" data-action="event-on-day" data-id="${day}">${icon('plus',16)} New event</button></div></div>`);
}
const findEvent = id => state.data.events.find(e => e.id === id);
const actions = {
  page: async id => {
    state.page = id;
    state.menu = false;
    state.mobileThread = false;
    render();
    if (id === 'messages') await loadMessages({mark:false});
  },
  menu: () => { state.menu = !state.menu; render(); },
  back: () => { state.mobileThread = false; render(); },
  thread: selectThread,
  filter: id => {
    state.messageFilter = id;
    document.querySelectorAll('[data-action="filter"]').forEach(button => {
      button.classList.toggle('chosen', button.dataset.id === id);
      button.setAttribute('aria-pressed',button.dataset.id === id);
    });
    updateInbox();
  },
  'new-thread': () => newThread(),
  'message-person': newThread,
  'profile-menu': profileMenu,
  'profile-edit': () => openModal('Edit profile',profileFields(mine())),
  'intake-back': () => {
    const form = document.querySelector('#profile-form');
    showIntake(form,Number(form.querySelector('[data-intake]:not([hidden])').dataset.intake)-1);
  },
  'switch-person': id => state.auth?.offline ? openDemoAccount(id) : changeWorkspace('demo',id),
  'switch-demo': () => changeWorkspace('demo'),
  'switch-live': () => changeWorkspace('live'),
  'account-switch': kind => {
    state.accountKind = kind;
    state.accountNotice = '';
    return renderAccountGate(true);
  },
  'account-signout': accountSignOut,
  'google-info': () => openModal('Google sign-in', '<div class="dialog-form"><p>Google sign-in is available when TechWomen AZ runs on a server configured with a Google OAuth client.</p><div class="form-actions"><button type="button" class="button primary" data-action="close">Done</button></div></div>'),
  close: () => modal.close(),
  'event-new': () => eventForm(null),
  'thread-event': () => eventForm(null,activeThread().members.filter(id => id !== mine().id),'',true),
  'event-view': id => showEvent(findEvent(id)),
  'event-edit': id => { const e = findEvent(id); if (e) eventForm(e,e.guests); },
  'event-download': id => { const e = findEvent(id); if (e) downloadEvent(e); },
  'event-remove': id => openModal('Delete this event?',`<div class="dialog-form"><p>It will be removed from the workspace calendar and from invited guests’ schedules.</p><div class="form-actions">${cancel}<button type="button" class="button destructive" data-action="event-remove-confirm" data-id="${attr(id)}">Delete event</button></div></div>`),
  'event-remove-confirm': async id => {
    await api('delete-event',{id}); modal.close(); await refresh({full:true}); toast('Event deleted.');
  },
  'calendar-filter': id => { state.calendar = id; render(); document.querySelector('[data-action="calendar-filter"][data-id="' + id + '"]')?.focus(); },
  'prev-month': () => moveMonth(-1,'prev-month'),
  'next-month': () => moveMonth(1,'next-month'),
  today: () => {
    state.month = new Date(new Date().getFullYear(),new Date().getMonth(),1);
    render(); document.querySelector('[data-action="today"]')?.focus();
  },
  'day-events': dayEvents,
  'event-on-day': day => eventForm(null,[],day),
  reminders: reminderMenu,
  dismiss: async id => { await api('dismiss',{id}); await refresh(); reminderMenu(); },
  assistant: id => assistant(id),
  'assistant-confirm': id => assistant(id,true),
  'copy-assistant': async () => {
    const result = document.querySelector('#assistant-result');
    try {
      await navigator.clipboard.writeText(result.textContent);
      toast('Copied.');
    } catch {
      const range = document.createRange();
      range.selectNodeContents(result);
      window.getSelection().removeAllRanges();
      window.getSelection().addRange(range);
      toast('Text selected. Press Ctrl+C to copy.');
    }
  },
  'use-draft': () => {
    const text = document.querySelector('#assistant-result').textContent;
    const existing = state.drafts.get(state.active);
    const merged = existing ? existing + '\n\n' + text : text;
    const draft = document.querySelector('#draft');
    state.drafts.set(state.active, merged.slice(0,3000));
    modal.close();
    if (draft) { draft.value = state.drafts.get(state.active); draft.focus(); }
  },
};
function moveMonth(amount, action) {
  state.month = new Date(state.month.getFullYear(),state.month.getMonth() + amount,1);
  render();
  document.querySelector('[data-action="' + action + '"]')?.focus();
}
document.addEventListener('click', async event => {
  const button = event.target.closest('button[data-action]');
  if (!button || !Object.hasOwn(actions,button.dataset.action)) return;
  if (button.dataset.action === 'event-remove-confirm') button.disabled = true;
  try { await actions[button.dataset.action](button.dataset.id); }
  catch (error) { toast(error.message); }
  finally { if (button.isConnected) button.disabled = false; }
});
document.addEventListener('input', event => {
  if (event.target.id === 'recipient-search') filterRecipients(event.target);
  if (event.target.id === 'thread-search') {
    state.filter = event.target.value;
    updateInbox();
  }
  if (event.target.id === 'draft') state.drafts.set(state.active,event.target.value);
});
document.addEventListener('change', event => {
  const form = event.target.form;
  if (form?.id !== 'event-form') return;
  if (event.target.name === 'format') {
    const online = event.target.value === 'Online';
    form.querySelector('#location-label').firstChild.textContent = online ? 'Meeting link ' : 'Location ';
    form.elements.location.placeholder = online ? 'https://…' : 'Address or meeting place';
  }
  if (event.target.name === 'visibility') form.querySelector('#visibility-note').textContent = event.target.value === 'Public'
    ? 'Visible to everyone in this workspace.' : 'Visible to you and the people you invite.';
  if (event.target.name === 'start' && form.elements.start.value >= form.elements.end.value) {
    const start = new Date(form.elements.start.value).getTime();
    if (Number.isFinite(start)) form.elements.end.value = localDateTime(start + 1800000);
  }
});
document.addEventListener('keydown', event => {
  if (event.target.id === 'draft' && event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
    event.preventDefault();
    event.target.form.requestSubmit();
  }
});
const pendingMessages = new Map();
document.addEventListener('submit', async event => {
  const form = event.target;
  if (!['account-form','composer','event-form','new-thread-form','profile-form'].includes(form.id)) return;
  event.preventDefault();
  const button = form.querySelector('button[type="submit"]');
  if (button.disabled) return;
  const fields = new FormData(form);
  button.disabled = true;
  const errorLine = form.querySelector('.form-error');
  if (errorLine) errorLine.textContent = '';
  try {
    if (form.id === 'account-form') {
      const details = Object.fromEntries(fields);
      const create = form.dataset.kind === 'register';
      if (create) state.accountPreferred = details.preferred;
      if (state.auth.offline) {
        const account = await demoApi(null,create ? 'demo-register' : 'demo-sign-in',details);
        if (account.id) await openDemoAccount(account.id);
      } else {
        await authPost(create ? 'register' : 'sign-in',details);
        state.auth.signedIn = true;
        await changeWorkspace('live');
      }
      return;
    }
    if (form.id === 'composer') {
      const id = state.active;
      const draft = form.querySelector('#draft');
      const text = draft.value.trim();
      if (!text) return;
      const retry = pendingMessages.get(id);
      const messageId = retry?.text === text ? retry.id : crypto.randomUUID();
      pendingMessages.set(id,{text,id:messageId});
      await api('send',{thread:id,message:text,id:messageId});
      pendingMessages.delete(id);
      if (state.drafts.get(id)?.trim() === text) {
        state.drafts.delete(id);
        draft.value = '';
      }
      if (state.active === id) {
        await loadMessages({forceBottom:true});
        draft.focus();
      }
      await refresh();
    }
    if (form.id === 'new-thread-form') {
      const result = await api('new-thread',{title:fields.get('title'),people:fields.getAll('person'),requestId:form.dataset.request});
      modal.close();
      state.active = result.id;
      await refresh();
      await selectThread(result.id);
    }
    if (form.id === 'event-form') {
      const result = await api('event',{
        id:form.dataset.id || undefined,requestId:form.dataset.request,title:fields.get('title'),starts_at:new Date(fields.get('start')).getTime(),
        ends_at:new Date(fields.get('end')).getTime(),format:fields.get('format'),visibility:fields.get('visibility'),
        reminder:Number(fields.get('reminder')),location:fields.get('location'),notes:fields.get('notes'),guests:fields.getAll('person'),
      });
      await refresh({full:state.page === 'calendar'});
      showEvent(findEvent(result.id));
      toast('Event saved.');
    }
    if (form.id === 'profile-form') {
      const index = Number(form.querySelector('[data-intake]:not([hidden])').dataset.intake);
      for (const input of form.querySelectorAll('[data-intake]:not([hidden]) input, [data-intake]:not([hidden]) select, [data-intake]:not([hidden]) textarea')) {
        if (!input.reportValidity()) return;
      }
      if (index < 3) { showIntake(form,index+1); return; }
      const onboarding = !mine()?.intake?.story;
      await api('profile',Object.fromEntries(fields));
      if (modal.open) modal.close();
      if (onboarding) state.page = fields.get('role') === 'Mentor' ? 'messages' : 'people';
      await refresh({full:true});
      toast('Profile saved.');
    }
  } catch (error) { formError(form,error); }
  finally { button.disabled = false; }
});

modal.addEventListener('click', event => {
  if (event.target !== modal) return;
  const bounds = modal.getBoundingClientRect();
  if (event.clientX < bounds.left || event.clientX > bounds.right || event.clientY < bounds.top || event.clientY > bounds.bottom) modal.close();
});

async function initialize() {
  if (demoApi) {
    const person = storage.get('tw.demo.session');
    state.auth = {accounts:true,offline:true,signedIn:!!person,googleAvailable:false};
    state.accountKind = 'register';
    if (person) {
      state.mode = 'demo';
      state.as = person;
    }
  } else {
    state.auth = await getAuthStatus();
    if (state.auth?.accounts) {
      state.mode = 'live';
      const callback = new URLSearchParams(location.search).get('auth');
      state.accountKind = callback ? 'sign-in' : 'register';
      if (callback) {
        state.accountNotice = googleNotices[callback] || '';
        history.replaceState(null,'',location.pathname);
      }
    }
  }
  if (state.auth?.accounts && !state.auth.signedIn) {
    await renderAccountGate();
    return;
  }
  await refresh({full:true});
  await loadMessages({mark:false,forceBottom:true});
  if (state.accountNotice) toast(state.accountNotice);
}
try { await initialize(); }
catch (error) {
  if (state.auth?.offline && state.auth.signedIn) {
    await accountSignOut();
  } else {
    app.innerHTML = `<main class="onboard" id="main"><section class="panel onboard-card"><img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+CiAgPHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTciIGZpbGw9IiNiY2E4ZmYiLz4KICA8cGF0aCBkPSJNMjQgMjIgMTMgMzJsMTEgMTBtMTYtMjAgMTEgMTAtMTEgMTBNMzYgMTlsLTggMjYiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzI1MTczZiIgc3Ryb2tlLXdpZHRoPSI0LjUiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCIvPgo8L3N2Zz4K" width="45" height="45" alt=""><h1>TechWomen AZ</h1><p>${esc(error.message)}</p>
      ${error.status === 401 ? '<a class="button primary" href="/signin-with-chatgpt?return_to=%2F" target="_top">Sign in with ChatGPT</a>' : '<a class="button primary" href="/">Try again</a>'}</section></main>`;
  }
}
let checking = false;
setInterval(async () => {
  if (document.hidden || !state.data || checking) return;
  checking = true;
  try {
    await refresh();
    await loadMessages({mark:!modal.open && (state.mobileThread || matchMedia('(min-width: 761px)').matches)});
  } catch (error) {
    if (state.auth?.accounts && !state.auth.offline && error.status === 401 && state.data) {
      refreshCount++;
      Object.assign(state,{data:null,active:null,messages:[],drafts:new Map(),accountKind:'sign-in',accountNotice:'Your session ended. Sign in again to continue.'});
      state.auth.signedIn = false;
      if (modal.open) modal.close();
      await renderAccountGate();
    } else updateBadges();
  } finally {
    checking = false;
  }
}, 5500);

</script>
